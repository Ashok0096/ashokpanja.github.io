<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
    <title>Login Page :: MDCare Patient Portal</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
      <link href="img/favicon.png" rel="icon">
      <!-- bootstrap css -->
      <link rel="stylesheet" href="css/bootstrap.min.css" />
      <link rel="stylesheet" href="style.css" />
      <!-- responsive css -->
      <link rel="stylesheet" href="css/responsive.css" />

   </head>
   <body class="inner_page login">
      <div class="full_container">
         <div class="container">
            <div class="center verticle_center full_height">
               <div class="login_section">
                  <div class="logo_login">
                     <div class="center">
                        <img  src="img/logo.png" alt="#" class="img-fluid w-75" />
                     </div>
                  </div>
                  <div class="login_form">
                     <form>
                        <fieldset>
                           <div class="field">
                              <label class="label_field"> Email Address</label>
                              <input type="email" name="email" placeholder="E-mail" />
                           </div>
                           <div class="field">
                              <label class="label_field">Password</label>
                              <input type="password" name="password" placeholder="Password" />
                           </div>
                           <div class="field">
                             <label class="label_field hidden">hidden label</label>
                              <label class="form-check-label btn btn-primary">  Register </label>
                              <a class="forgot" href="">Forgotten Password?</a>
                           </div>
                          <div class="field margin_0">
    <label class="label_field hidden">hidden label</label>
    <button 
        type="button" 
        class="main_bt"
        onclick="window.location.href='index.html';">
        Sign In
    </button>
</div>
                        </fieldset>
                     </form>
                  </div>
                  
               </div>
            </div>
            <div class="alert  alert-warning alert-dismissible fade show text-center">WARNING: Unauthorized access to this system is forbidden and will be prosecuted by law. By accessing this system all your activities will be monitored.
This Application is best viewed using <span class="text-primary"> 1024 x768 screen resolution.</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
         </div>
         
      </div>
      <!-- jQuery -->
      <script src="js/jquery.min.js"></script>
      <script src="js/popper.min.js"></script>
      <script src="js/bootstrap.min.js"></script>
      <!-- wow animation -->
      <script src="js/animate.js"></script>
      <!-- select country -->
      <script src="js/bootstrap-select.js"></script>
      <!-- nice scrollbar -->
      <script src="js/perfect-scrollbar.min.js"></script>
      <script>
         var ps = new PerfectScrollbar('#sidebar');
      </script>
      <!-- custom js -->
      <script src="js/custom.js"></script>
   </body>
</html>
