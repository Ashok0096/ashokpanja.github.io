<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Portal Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap 5 CSS -->
<link href="css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome v4 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">


</head>
<body>


<!-- Background Slider -->
<div id="bgSlider" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d"
                 class="w-100" alt="Hospital Interior">
        </div>

        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1584515933487-779824d29309"
                 class="w-100" alt="Doctor with Patient">
        </div>

        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1579684385127-1ef15d508118"
                 class="w-100" alt="Medical Technology">
        </div>
    </div>
</div>


<!-- Overlay -->
<div class="overlay"></div>

<!-- Login Form -->
<div class="login-container">
    <div class="card login-card p-4">
        <div class="card-body">
            <h4 class="text-center portal-title mb-2"><img src="img/logo.png" class="img-fluid w-75"/> </h4>
           

           

            <form id="loginForm" class="pt-3">
               <!-- Username input with icon -->
<div class="mb-3">
    
    <div class="input-group">
        <span class="input-group-text"><i class="fa fa-user"></i></span>
        <input type="text" id="username" class="form-control" placeholder="  Patient Username" required="">
    </div>
</div>

<!-- Password input with icon -->
<div class="mb-3">
   
    <div class="input-group">
        <span class="input-group-text"><i class="fa fa-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="  Password" required="">
    </div>
</div>
               

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Login 
                </button>
                 <div class="d-flex justify-content-between align-items-center my-3">
                  <a href="#" class="text-decoration-none Register" id="openRegisterModal">Register</a>

                    <a href="#" class="text-decoration-none Forgot-Password" id="openForgotPasswordModal">Forgot Password?</a>
                </div>
            </form>

            
        </div>
    </div>
    
</div>
<!-- Footer Section -->
<footer class=" text-light pt-4 pb-3 mt-5">
    <div class="container text-center">
       

        <!-- Copyright -->
        <p class="mb-0" style="font-size: 0.85rem;">
            &copy; All rights reserved. Unauthorized Duplication or Distribution is Prohibited
Vision Infonet Inc, <a href="mailto:support@vinfonet.com" class="text-info"> <i class="fa fa-envelope me-2" aria-hidden="true"></i>support@vinfonet.com</a> 
        </p>
    </div>
</footer>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Registration-Patient Information Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">
Registration-Patient Information</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
         <div class="accordion pb-3" id="accordionExample">
  <div class="accordion-item">
    <h2 class="accordion-header" id="headingOne">
      <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
        Clinical Ref Number
      </button>
    </h2>
    <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
      <div class="accordion-body">
      <form>
          <div class="mb-3">
           
            <input type="text" class="form-control" id="username" placeholder="  Clinical Ref Number">
          </div>
               <div class="mb-1">
            <label for="username" class="form-label text-center w-100 pb-5"><a href="#"> Check & Proceed</a></label>
         
          </div>
          
     
        </form>
      </div>
    </div>
  </div>
  <div class="accordion-item">
    <h2 class="accordion-header" id="headingTwo">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
       Login Information
      </button>
    </h2>
    <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#accordionExample">
      <div class="accordion-body">
     <form>
          <div class="mb-3">
            <label for="User-ID" class="form-label">User ID</label>
            <input type="User-ID" class="form-control" id="User-ID" placeholder="  User ID" required="">
          </div>
               
          <div class="mb-3">
            <label for="Password" class="form-label">Password</label>
            <input type="Password" class="form-control" id="Password" placeholder="  Password" required="">
          </div>
           <div class="mb-3">
            <label for="Confirm Password" class="form-label">Confirm Password</label>
            <input type="Confirm Password" class="form-control" id="onfirm-Password" placeholder="  Confirm Password" required="">
          </div>
        <div class="d-flex justify-content-center align-items-center gap-2">
          <button type="submit" class="btn btn-primary ">submit1</button>
          <button type="Clear" class="btn btn-primary ">Clear</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
</div>
       
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  // Get the modal element
  const registerModal = new bootstrap.Modal(document.getElementById('registerModal'));

  // Open modal on clicking the link
  document.getElementById('openRegisterModal').addEventListener('click', function(e){
    e.preventDefault();
    registerModal.show();
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>



<!-- ForgotPassword Modal -->
<div class="modal fade" id="ForgotPasswordModal" tabindex="-1" aria-labelledby="ForgotPasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content pb-3">
      <div class="modal-header">
        <h5 class="modal-title" id="ForgotPasswordModalLabel">Clinical Ref Number</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="username" class="form-label">User ID</label>
            <input type="text" class="form-control" id="username" placeholder="  User ID">
          </div>
               <div class="mb-1">
            <label for="username" class="form-label text-center w-100">(or)</label>
         
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Clinical Ref Number</label>
            <input type="email" class="form-control" id="email" placeholder="  Clinical Ref Number">
          </div>
        <div class="d-flex justify-content-center align-items-center gap-2 pb-5">
          <button type="submit" class="btn btn-primary ">submit</button>
          <button type="Clear" class="btn btn-primary ">Clear</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  // Get the modal element
  const ForgotPasswordModal = new bootstrap.Modal(document.getElementById('ForgotPasswordModal'));

  // Open modal on clicking the link
  document.getElementById('openForgotPasswordModal').addEventListener('click', function(e){
    e.preventDefault();
    ForgotPasswordModal.show();
  });
</script>

</body>
</html>
